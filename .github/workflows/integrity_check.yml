name: Run Integrity Validation

on:
  push:
  workflow_dispatch:

jobs:
  code_quality_check:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 🐍 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧹 Run autoflake to remove unused imports
        run: |
          autoflake --in-place --recursive --remove-unused-variables --remove-all-unused-imports src

      - name: 💀 Run vulture to find dead code
        run: |
          vulture src || echo "⚠️ Vulture found unused code — review manually if needed"

      - name: 🚀 Commit autoflake changes + Sync Notes
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🤖 robot: auto-clean unused imports & variables"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 1️⃣ Fetch remote notes FIRST
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # 2️⃣ Add note locally
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # 3️⃣ Push commit
            git push origin HEAD

            # 4️⃣ Force-push notes
            git push --force origin refs/notes/commits
          else
            echo "No autoflake changes to commit."
          fi
  
  integrity-check:
    name: Integrity Investigation
    needs: code_quality_check
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 📦 Install Dropbox SDK
        run: pip install dropbox

      - name: 🔓 Make download script executable
        run: chmod +x src/download_from_dropbox.sh

      - name: ⬇️ Download files from Dropbox
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: src/download_from_dropbox.sh

      - name: 📁 List full repository structure (recursive)
        run: ls -R

      - name: 🔓 Make navier_stokes validation script executable
        run: chmod +x validators/validate_navier_stokes_results.sh

      - name: 🧭 Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: 🧭 Show PYTHONPATH
        run: echo $PYTHONPATH

      - name: ✅ Validate enriched_metadata.json
        run: python validators/validate_enriched_metadata.py

      - name: ✅ Validate flow_data.json
        run: python validators/validate_flow_data.py

      - name: ✅ Validate boundary_conditions_gmsh.json
        run: python validators/validate_boundary_conditions_gmsh.py

      - name: ✅ Validate geometry_masking_gmsh.json
        run: python validators/validate_geometry_masking_gmsh.py

      - name: ✅ Validate fluid_simulation_input.json
        run: python validators/validate_fluid_simulation_input.py